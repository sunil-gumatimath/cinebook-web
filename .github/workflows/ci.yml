name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  container:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: movie-ticket-booking-frontend:ci

      - name: Smoke test the image
        run: |
          docker run -d --name fe -p 8080:8080 \
            -e API_HOST=localhost -e API_PORT=8080 \
            movie-ticket-booking-frontend:ci
          # Give nginx a moment to boot, then assert the SPA shell is served.
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "SPA served OK"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not serve the SPA in time" >&2
          docker logs fe >&2 || true
          exit 1
